version: 2

sources:
  - name: raw
    schema: main
    tables:
      - name: raw_transactions
        description: "Raw synthetic financial transactions generated by generate_data.py"
        columns:
          - name: transaction_id
            description: "Unique transaction identifier"
            tests:
              - unique
              - not_null
          - name: date
            description: "Transaction date"
            tests:
              - not_null
          - name: amount
            description: "Transaction amount in EUR"
            tests:
              - not_null
          - name: vendor
            description: "Vendor name"
            tests:
              - not_null
          - name: category
            description: "Expense category"
            tests:
              - not_null
          - name: submitted_by
            description: "Employee who submitted the transaction"
            tests:
              - not_null
          - name: approved
            description: "Whether the transaction was approved"
            tests:
              - not_null
          - name: currency
            description: "Transaction currency (always EUR)"
            tests:
              - not_null
